name: rocket_phone_contact
description: A thoughtfully simple contacts directory with resilient search and pagination.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  fake_async: ^1.3.3
  freezed: ^4.0.2
  injectable_generator: ^3.1.3
  json_serializable: ^6.11.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/contacts.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#171717"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
